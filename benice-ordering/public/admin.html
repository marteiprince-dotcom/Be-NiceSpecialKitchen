<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Be-nice Admin</title>
  <link rel="stylesheet" href="/admin.css">
</head>

<body>

  <!-- LOGIN -->
  <div id="loginView" class="login">
    <div class="login-card">

      <img src="/assets/logo.png" alt="logo">

      <span class="eyebrow">STAFF AREA</span>

      <h1>Restaurant dashboard</h1>

      <p>Sign in to manage orders and menu items.</p>

      <form id="loginForm">

        <input
          name="username"
          placeholder="Username"
          required
        >

        <input
          name="password"
          type="password"
          placeholder="Password"
          required
        >

        <button>Sign in</button>

        <div id="loginError"></div>

      </form>

    </div>
  </div>


  <!-- ADMIN APP -->
  <div id="app" hidden>

    <header>

      <div class="top">

        <div class="brand">

          <img src="/assets/logo.png">

          <div>
            BE-NICE
            <small>STAFF DASHBOARD</small>
          </div>

        </div>

        <div>

          <a href="/" class="view">
            View site
          </a>

          <button id="logout" class="dark">
            Logout
          </button>

        </div>

      </div>

    </header>


    <main>

      <!-- ORDERS -->

      <div class="page-head">

        <div>

          <span class="eyebrow">
            OPERATIONS
          </span>

          <h1>Orders</h1>

        </div>

        <button
          class="yellow"
          id="refresh"
        >
          Refresh
        </button>

      </div>


      <div
        class="status-tabs"
        id="statusTabs"
      ></div>


      <section
        class="orders"
        id="orders"
      ></section>


      <!-- MENU -->

      <section class="admin-section">

        <div class="section-head">

          <div>

            <span class="eyebrow">
              CATALOG
            </span>

            <h2>Menu</h2>

          </div>

          <button
            class="yellow"
            id="newItem"
          >
            + Add item
          </button>

        </div>


        <div id="menuAdmin"></div>

      </section>


      <!-- SETTINGS -->

      <section class="admin-section">

        <div class="section-head">

          <div>

            <span class="eyebrow">
              SETTINGS
            </span>

            <h2>Restaurant</h2>

          </div>

        </div>


        <form
          id="settingsForm"
          class="settings-form"
        >

          <input
            name="restaurant_name"
            placeholder="Restaurant name"
          >

          <input
            name="restaurant_phone"
            placeholder="Phone"
          >

          <input
            name="whatsapp"
            placeholder="WhatsApp number e.g. 23324..."
          >

          <input
            name="delivery_fee"
            type="number"
            step="0.01"
            placeholder="Delivery fee"
          >

          <input
            name="address"
            placeholder="Restaurant address"
          >

          <input
            name="opening_hours"
            placeholder="Opening hours"
          >

          <select name="opening_status">

            <option>
              Open
            </option>

            <option>
              Closed
            </option>

          </select>


          <button class="yellow">
            Save settings
          </button>

          <div id="settingsMsg"></div>

        </form>

      </section>

    </main>

  </div>


  <!-- ADD / EDIT ITEM MODAL -->

  <div
    class="modal"
    id="itemModal"
  >

    <div class="modal-card">

      <button
        class="x"
        id="closeItem"
        type="button"
      >
        ×
      </button>


      <span class="eyebrow">
        MENU ITEM
      </span>


      <h2 id="itemTitle">
        Add item
      </h2>


      <form id="itemForm">

        <input
          type="hidden"
          name="id"
        >


        <!-- NAME -->

        <input
          name="name"
          placeholder="Item name"
          required
        >


        <!-- DESCRIPTION -->

        <textarea
          name="description"
          placeholder="Short description"
        ></textarea>


        <!-- PRICING TYPE -->

        <label for="pricingType">
          Pricing type
        </label>

        <select
          name="pricingType"
          id="pricingType"
          required
        >

          <option value="fixed">
            Fixed Price
          </option>

          <option value="variable">
            Customer Enters Price
          </option>

        </select>


        <!-- FIXED PRICE -->

        <div id="fixedPriceField">

          <label for="price">
            Price
          </label>

          <input
            name="price"
            id="price"
            type="number"
            min="0"
            step="0.01"
            placeholder="e.g. 35"
          >

        </div>


        <!-- VARIABLE MINIMUM PRICE -->

        <div
          id="minimumPriceField"
          hidden
        >

          <label for="minPrice">
            Minimum Price
          </label>

          <input
            name="minPrice"
            id="minPrice"
            type="number"
            min="0"
            step="0.01"
            placeholder="e.g. 5"
          >

          <small>
            Customer must enter at least this amount.
          </small>

        </div>


        <!-- CATEGORY -->

        <label for="categoryId">
          Category
        </label>

        <select
          name="categoryId"
          id="categoryId"
          required
        ></select>


        <!-- IMAGE -->

        <input
          name="image"
          placeholder="Image URL (optional)"
        >


        <!-- AVAILABILITY -->

        <label class="check">

          <input
            type="checkbox"
            name="available"
            checked
          >

          Available for ordering

        </label>


        <!-- SAVE -->

        <button
          class="yellow"
          type="submit"
        >
          Save item
        </button>


        <div id="itemError"></div>

      </form>

    </div>

  </div>


  <script src="/admin.js"></script>

</body>
</html>
